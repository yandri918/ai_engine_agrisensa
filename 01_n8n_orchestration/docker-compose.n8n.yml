version: "3.8"

# ============================================================
# AgriSensa AI Engine — n8n Workflow Stack
# Includes: n8n, PostgreSQL, Redis
# ============================================================

services:
  # ----------------------------------------------------------
  # n8n — Workflow Orchestrator
  # ----------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: agrisensa_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Basic Auth
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-agrisensa}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-agrisensa2026}
      # Database (use PostgreSQL instead of SQLite for production)
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME:-n8n_agrisensa}
      - DB_POSTGRESDB_USER=${N8N_DB_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD:-n8n_secret}
      # n8n Core
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://${N8N_HOST:-localhost}:5678/
      - EXECUTIONS_PROCESS=main
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=true
      - EXECUTIONS_DATA_MAX_AGE=168  # 7 days in hours
      - N8N_LOG_LEVEL=info
      - N8N_LOG_OUTPUT=console,file
      - N8N_LOG_FILE_LOCATION=/home/node/.n8n/logs/n8n.log
      # Timezone
      - GENERIC_TIMEZONE=Asia/Jakarta
      - TZ=Asia/Jakarta
      # API Keys (passed to nodes)
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ROBOFLOW_API_KEY=${ROBOFLOW_API_KEY}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - FIREBASE_SERVER_KEY=${FIREBASE_SERVER_KEY}
      - BAPANAS_API_KEY=${BAPANAS_API_KEY}
      # AgriSensa Internal Services
      - AGRISENSA_API_URL=${AGRISENSA_API_URL:-http://host.docker.internal:8000}
      - AGRISENSA_CHROMADB_URL=${AGRISENSA_CHROMADB_URL:-http://host.docker.internal:8001}
      - AGRISENSA_MLFLOW_URL=${AGRISENSA_MLFLOW_URL:-http://host.docker.internal:5000}
      # Redis for caching
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secret}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/home/node/workflows:ro  # Mount workflow JSONs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - agrisensa_n8n_net
    labels:
      - "traefik.enable=false"

  # ----------------------------------------------------------
  # PostgreSQL — Persistent storage for n8n + AgriSensa data
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: agrisensa_n8n_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${N8N_DB_USER:-n8n}
      - POSTGRES_PASSWORD=${N8N_DB_PASSWORD:-n8n_secret}
      - POSTGRES_DB=${N8N_DB_NAME:-n8n_agrisensa}
      - POSTGRES_MULTIPLE_DATABASES=n8n_agrisensa,agrisensa_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5433:5432"  # Expose on 5433 to avoid conflict with local PG
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_DB_USER:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agrisensa_n8n_net

  # ----------------------------------------------------------
  # Redis — Session cache, rate limiting, pub/sub
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: agrisensa_n8n_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"  # Expose on 6380 to avoid conflict with local Redis
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agrisensa_n8n_net

  # ----------------------------------------------------------
  # ChromaDB — Vector store for RAG (optional, if not running locally)
  # ----------------------------------------------------------
  chromadb:
    image: chromadb/chroma:latest
    container_name: agrisensa_chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
      - ANONYMIZED_TELEMETRY=false
    networks:
      - agrisensa_n8n_net

# ----------------------------------------------------------
# Volumes
# ----------------------------------------------------------
volumes:
  n8n_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  chromadb_data:
    driver: local

# ----------------------------------------------------------
# Networks
# ----------------------------------------------------------
networks:
  agrisensa_n8n_net:
    driver: bridge
    name: agrisensa_n8n_net
